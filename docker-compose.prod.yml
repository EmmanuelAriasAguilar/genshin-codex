name: genshin-codex-prod

# Producción: https://genshin.emmanuelariasa.com
# - Solo el frontend se expone por Traefik (red externa `web`, TLS resolver `le`).
# - Backend + Postgres viven en la red interna `genshin`, sin puertos publicados.
# - El frontend proxea /api -> genshin-backend (mismo patrón que dev-platform).

networks:
  web:
    external: true
    name: web
  genshin:
    driver: bridge

volumes:
  genshin_pgdata:

services:
  genshin-db:
    image: postgres:16-alpine
    container_name: genshin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genshin_codex
    volumes:
      - genshin_pgdata:/var/lib/postgresql/data
    networks:
      - genshin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d genshin_codex"]
      interval: 5s
      timeout: 3s
      retries: 10

  genshin-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: genshin-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://codex:${POSTGRES_PASSWORD}@genshin-db:5432/genshin_codex
      PORT: "4901"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    depends_on:
      genshin-db:
        condition: service_healthy
    networks:
      - genshin

  genshin-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: genshin-frontend
    restart: unless-stopped
    environment:
      PORT: "4900"
      BACKEND_URL: http://genshin-backend:4901
    depends_on:
      - genshin-backend
    networks:
      - web
      - genshin
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.genshin.rule=Host(`genshin.emmanuelariasa.com`) || Host(`resonance.emmanuelariasa.com`)"
      - "traefik.http.routers.genshin.entrypoints=websecure"
      - "traefik.http.routers.genshin.tls.certresolver=le"
      - "traefik.http.services.genshin.loadbalancer.server.port=4900"
